<!DOCTYPE html>
<html lang="ja">
<head>
  <meta name="author" content="Clark & Company">
  <meta property="og:title" content="PDF分割ツール">
  <meta charset="UTF-8" />
  <title>PDF Splitter</title>
  <style>
    body { font-family: 'Noto Sans JP', sans-serif; margin: 0; padding: 40px; background: #449073; color: #333; display: flex; justify-content: center; }
    .container { max-width: 720px; background: #fff; padding: 40px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.08); }
    h1 { text-align: center; margin-bottom: 25px; }
    h2 { margin-top: 28px; border-bottom: 1px solid #dee2e6; padding-bottom: 10px; }
    label { font-weight: 500; margin-bottom: 10px; display: block; }
    input[type="file"] { display: block; width: 100%; padding: 12px; margin-bottom: 20px; border: 1px solid #dee2e6; border-radius: 6px; }
    .status { padding: 12px; border-radius: 8px; margin-top: 10px; font-weight: 500; border: 1px solid transparent; }
    .success { background: #d4edda; color: #155724; }
    .error { background: #f8d7da; color: #721c24; }
    .info { background: #e2f2ff; color: #004085; }
    #downloadLinks ul { list-style: none; padding: 0; margin-top: 12px; }
    #downloadLinks li { margin-bottom: 10px; padding: 8px 0; border-bottom: 1px dashed #dee2e6; }
    #downloadLinks li:last-child { border-bottom: none; }
    #downloadLinks a { text-decoration: none; color: #007bff; font-weight: 500; cursor: pointer; }
    .button-group { margin-top: 16px; display: flex; gap: 10px; justify-content: space-between; align-items: center; }
    .download-button { background-color: #28a745; color: #fff; border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; }
    .download-button:disabled { background-color: #6c757d; cursor: not-allowed; }
    .warn { background: #fff6e5; border: 1px solid #ffcc80; color: #8a5a00; padding: 10px; border-radius: 8px; }
    .warn ul { margin: 8px 0 0 0; padding-left: 18px; }
    .footer-note { font-size: 0.85em; color: #6c757d; text-align: center; margin-top: 24px; border-top: 1px solid #dee2e6; padding-top: 16px; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
</head>
<body>
<div class="container">
  <h1>PDF 分割ツール</h1>
  <p class="info status">&#x2139; PDFはブラウザ内で処理され、外部に送信されません。</p>

  <label for="pdfFile">分割するPDFファイルを選択してください:</label>
  <input type="file" id="pdfFile" accept=".pdf" />
  <div id="status" class="status success">&#x2705; 準備完了。PDFファイルを選択してください。</div>

  <h2>出力結果</h2>
  <div class="button-group">
    <div id="warningBox" class="warn" style="display:none;">
      <strong>警告:</strong>
      <ul id="warningList"></ul>
    </div>
    <button id="downloadAll" class="download-button" disabled>すべてダウンロード</button>
  </div>
  <div id="downloadLinks"><p>ここに分割されたファイルが表示されます。</p></div>

  <div class="footer-note">
    <p>※ 各ファイルが10MB以下になるようにページ単位で分割します。<br>1ページで10MBを超える場合は、そのページを単独で保存します。</p>
    <p>by Clark & Company</p>
  </div>
</div>

<script>
  const MAX_SIZE_BYTES = 10 * 1024 * 1024; // 10MB
  let splitFilesData = [];

  const pdfFileElement = document.getElementById('pdfFile');
  const downloadLinksDiv = document.getElementById('downloadLinks');
  const statusDiv = document.getElementById('status');
  const downloadAllButton = document.getElementById('downloadAll');
  const warningBox = document.getElementById('warningBox');
  const warningList = document.getElementById('warningList');

  function formatMB(bytes) {
    return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
  }
  function addWarning(text) {
    warningBox.style.display = 'block';
    const li = document.createElement('li');
    li.textContent = text;
    warningList.appendChild(li);
  }

  pdfFileElement.addEventListener('change', async (event) => {
    const file = event.target.files && event.target.files[0];
    if (!file) return;

    statusDiv.textContent = `\u2139 「${file.name}」の分割を開始します...`;
    statusDiv.className = 'status info';
    downloadLinksDiv.innerHTML = '';
    splitFilesData = [];
    warningBox.style.display = 'none';
    warningList.innerHTML = '';
    downloadAllButton.disabled = true;

    try {
      const arrayBuffer = await file.arrayBuffer();
      const originalPdfDoc = await PDFLib.PDFDocument.load(arrayBuffer);
      const totalPages = originalPdfDoc.getPageCount();

      let partNumber = 1;
      let currentPdfDoc = await PDFLib.PDFDocument.create();

      for (let pageIndex = 0; pageIndex < totalPages; pageIndex++) {
        // 1) 単一ページのサイズを事前判定
        const singleDoc = await PDFLib.PDFDocument.create();
        const [singlePage] = await singleDoc.copyPages(originalPdfDoc, [pageIndex]);
        singleDoc.addPage(singlePage);
        const singleBytes = await singleDoc.save();
        const singleBlob = new Blob([singleBytes], { type: 'application/pdf' });

        if (singleBlob.size > MAX_SIZE_BYTES) {
          // 単一ページ超過 → 警告付きで単独保存し、必ず次ページから再開
          addWarning(`ページ ${pageIndex + 1} は単体で ${formatMB(singleBlob.size)} のため10MB超過。単独保存します。`);
          await saveChunk(singleBytes, partNumber, file.name, downloadLinksDiv, '（※このページは1枚で10MBを超えています）');
          partNumber++;
          currentPdfDoc = await PDFLib.PDFDocument.create();
          continue;
        }

        // 2) チャンクに追加する前に「プレフライト」でサイズ試算
        const preflightDoc = await PDFLib.PDFDocument.create();
        // 既存チャンクの全ページを複製
        if (currentPdfDoc.getPageCount() > 0) {
          const pageIndices = Array.from({ length: currentPdfDoc.getPageCount() }, (_, i) => i);
          const copied = await preflightDoc.copyPages(currentPdfDoc, pageIndices);
          copied.forEach(p => preflightDoc.addPage(p));
        }
        // 追加予定ページを複製
        const [pfPage] = await preflightDoc.copyPages(originalPdfDoc, [pageIndex]);
        preflightDoc.addPage(pfPage);
        const pfBytes = await preflightDoc.save();
        const pfBlob = new Blob([pfBytes], { type: 'application/pdf' });

        if (pfBlob.size > MAX_SIZE_BYTES) {
          // 超過想定 → 直前までを保存し、現在ページから新チャンク開始
          if (currentPdfDoc.getPageCount() > 0) {
            const prevBytes = await currentPdfDoc.save();
            await saveChunk(prevBytes, partNumber, file.name, downloadLinksDiv);
            partNumber++;
          }
          currentPdfDoc = await PDFLib.PDFDocument.create();
          const [retryPage] = await currentPdfDoc.copyPages(originalPdfDoc, [pageIndex]);
          currentPdfDoc.addPage(retryPage);
          // retryは単一判定済みなので、ここで超えることはない（分割は継続）
        } else {
          // 超えない → 実チャンクへ追加
          const [copiedPage] = await currentPdfDoc.copyPages(originalPdfDoc, [pageIndex]);
          currentPdfDoc.addPage(copiedPage);
        }
      }

      // 3) 残っているチャンクを保存（分割は継続し警告のみ表示）
      if (currentPdfDoc.getPageCount() > 0) {
        const lastBytes = await currentPdfDoc.save();
        await saveChunk(lastBytes, partNumber, file.name, downloadLinksDiv);
      }

      statusDiv.textContent = '\uD83C\uDF89 分割が完了しました！';
      statusDiv.className = 'status success';
      downloadAllButton.disabled = false;

    } catch (err) {
      console.error(err);
      statusDiv.textContent = '\u274C エラーが発生しました: ' + (err && err.message ? err.message : String(err));
      statusDiv.className = 'status error';
      downloadAllButton.disabled = true;
    }
  });

  // チャンク保存＆リンク生成
  async function saveChunk(pdfBytes, partNum, originalFileName, container, note = '') {
    const baseName = originalFileName.replace(/\.pdf$/i, '');
    const fileName = `${baseName}_part${partNum}.pdf`;
    splitFilesData.push({ name: fileName, bytes: pdfBytes });

    const blob = new Blob([pdfBytes], { type: 'application/pdf' });

    const a = document.createElement('a');
    a.textContent = `${fileName} (${(blob.size / (1024 * 1024)).toFixed(2)} MB) ${note}`;
    a.addEventListener('click', () => saveAs(blob, fileName));

    const li = document.createElement('li');
    li.appendChild(a);

    let ul = container.querySelector('ul');
    if (!ul) {
      container.innerHTML = '';
      ul = document.createElement('ul');
      container.appendChild(ul);
    }
    ul.appendChild(li);
  }

  // すべて個別ダウンロード
  document.getElementById('downloadAll').addEventListener('click', async () => {
    if (splitFilesData.length === 0) return;
    statusDiv.textContent = '\u2139 ファイルを順番にダウンロードしています...';
    statusDiv.className = 'status info';
    downloadAllButton.disabled = true;

    for (const file of splitFilesData) {
      const blob = new Blob([file.bytes], { type: 'application/pdf' });
      saveAs(blob, file.name);
      await new Promise(r => setTimeout(r, 250));
    }

    statusDiv.textContent = '\u2705 ファイルのダウンロードが完了しました。';
    statusDiv.className = 'status success';
    downloadAllButton.disabled = false;
  });
</script>
</body>
</html>
