<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NATURE SOUNDS / Clark &AMP; Company</title>
    <link rel="stylesheet" href="sounds/styles.css">
</head>
<body>
    <div class="container">
        <h1>NATURE SOUNDS</h1>
        <H5>　　　　　一回再生 / ループ再生 / 停止 / フェードアウト</H5>
        <div id="soundButtons">
            <div class="soundControl" data-sound="sound1">
                <span class="material-icons">water_drop</span>
                <label> CALM RAIN</label>
                <button class="playOnce"><span class="material-icons">play_arrow</span></button>
                <button class="loopPlay"><span class="material-icons">loop</span></button>
                <button class="stop"><span class="material-icons">stop</span></button>
                <button class="fadeOut"><span class="material-icons">filter_list_off</span></button>
                <input type="range" class="volumeControl" min="0" max="1" step="0.01" value="0.5">
            </div>
            <div class="soundControl" data-sound="sound2">
                <span class="material-icons">water_drop</span>
                <label> HARD RAIN</label>
                <button class="playOnce"><span class="material-icons">play_arrow</span></button>
                <button class="loopPlay"><span class="material-icons">loop</span></button>
                <button class="stop"><span class="material-icons">stop</span></button>
                <button class="fadeOut"><span class="material-icons">filter_list_off</span></button>
                <input type="range" class="volumeControl" min="0" max="1" step="0.01" value="0.5">
            </div>
            <div class="soundControl" data-sound="sound3">
                <span class="material-icons">storm</span>
                <label> CALM WIND</label>
                <button class="playOnce"><span class="material-icons">play_arrow</span></button>
                <button class="loopPlay"><span class="material-icons">loop</span></button>
                <button class="stop"><span class="material-icons">stop</span></button>
                <button class="fadeOut"><span class="material-icons">filter_list_off</span></button>
                <input type="range" class="volumeControl" min="0" max="1" step="0.01" value="0.5">
            </div>
            <div class="soundControl" data-sound="sound4">
                <span class="material-icons">storm</span>
                <label> HARSH WIND</label>
                <button class="playOnce"><span class="material-icons">play_arrow</span></button>
                <button class="loopPlay"><span class="material-icons">loop</span></button>
                <button class="stop"><span class="material-icons">stop</span></button>
                <button class="fadeOut"><span class="material-icons">filter_list_off</span></button>
                <input type="range" class="volumeControl" min="0" max="1" step="0.01" value="0.5">
            </div>
            <div class="soundControl" data-sound="sound5">
                <span class="material-icons">forest</span>
                <label> FOREST</label>
                <button class="playOnce"><span class="material-icons">play_arrow</span></button>
                <button class="loopPlay"><span class="material-icons">loop</span></button>
                <button class="stop"><span class="material-icons">stop</span></button>
                <button class="fadeOut"><span class="material-icons">filter_list_off</span></button>
                <input type="range" class="volumeControl" min="0" max="1" step="0.01" value="0.5">
            </div>
            <div class="soundControl" data-sound="sound6">
                <span class="material-icons">nightlight</span>
                <label> NIGHT FOREST</label>
                <button class="playOnce"><span class="material-icons">play_arrow</span></button>
                <button class="loopPlay"><span class="material-icons">loop</span></button>
                <button class="stop"><span class="material-icons">stop</span></button>
                <button class="fadeOut"><span class="material-icons">filter_list_off</span></button>
                <input type="range" class="volumeControl" min="0" max="1" step="0.01" value="0.5">
            </div>
            <div class="soundControl" data-sound="sound7">
                <span class="material-icons">waves</span>
                <label> OCEAN</label>
                <button class="playOnce"><span class="material-icons">play_arrow</span></button>
                <button class="loopPlay"><span class="material-icons">loop</span></button>
                <button class="stop"><span class="material-icons">stop</span></button>
                <button class="fadeOut"><span class="material-icons">filter_list_off</span></button>
                <input type="range" class="volumeControl" min="0" max="1" step="0.01" value="0.5">
            </div>
            <div class="soundControl" data-sound="sound8">
                <span class="material-icons">water</span>
                <label> STREAM</label>
                <button class="playOnce"><span class="material-icons">play_arrow</span></button>
                <button class="loopPlay"><span class="material-icons">loop</span></button>
                <button class="stop"><span class="material-icons">stop</span></button>
                <button class="fadeOut"><span class="material-icons">filter_list_off</span></button>
                <input type="range" class="volumeControl" min="0" max="1" step="0.01" value="0.5">
            </div>
            <div class="soundControl" data-sound="sound9">
                <span class="material-icons">local_fire_department</span>
                <label>CAMPFIRE</label>
                <button class="playOnce"><span class="material-icons">play_arrow</span></button>
                <button class="loopPlay"><span class="material-icons">loop</span></button>
                <button class="stop"><span class="material-icons">stop</span></button>
                <button class="fadeOut"><span class="material-icons">filter_list_off</span></button>
                <input type="range" class="volumeControl" min="0" max="1" step="0.01" value="0.5">
            </div>
            <div class="soundControl" data-sound="sound10">
                <span class="material-icons">bolt</span>
                <label> THUNDER</label>
                <button class="playOnce"><span class="material-icons">play_arrow</span></button>
                <button class="loopPlay"><span class="material-icons">loop</span></button>
                <button class="stop"><span class="material-icons">stop</span></button>
                <button class="fadeOut"><span class="material-icons">filter_list_off</span></button>
                <input type="range" class="volumeControl" min="0" max="1" step="0.01" value="0.5">
            </div>
            <div style="padding-top: 10px;" class="allstop">
                    <label><strong>　　STOP ALL</strong></label>
                    <button id="stopAll"><span class="material-icons">stop</span></button>
                    <button id="fadeOutAll"><span class="material-icons">filter_list_off</span></button>
            </div>
        </div>
        <br>
        <H5 style="text-align: right;"><a href="https://x.com/clarkandcom" style="text-decoration: none; font-weight:bold; color: white;">By Clark &amp; Company <span class="material-icons">public</span></a></H5>
    </div>

    <script src="sounds/scripts.js"></script>
</body>
</html>
