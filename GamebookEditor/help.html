        <textarea id="editor" placeholder="ここにマークダウン記法でテキストを入力してください">
#ゲームブック・エディター
#0
テキスト入力でゲームブックを作成するアプリです。画面左側のテキストエリアにテキストを入力すると、右側にプレビューを表示します。

#1 見出し
行頭に「#」マークを書くと、その行を「大見出し」として表示します。特に「#」マークの直後に半角数字を書いた場合、次項で取り上げるリンクの移動先となるパラグラフ番号として機能します。
また、「#」を複数重ねると中見出しや小見出しに変換します。以下にその例を示します。
##中見出し
###小見出し
####小々見出し
#####小々々見出し
######小々々々見出し

#リンク
半角数字の直後に平仮名の「へ」を記述して改行すると、そのパラグラフ番号へのリンクに変換します。以下にその例を示します。
はい　0へ
いいえ　1へ
また、文の一部を半角の角括弧で囲むと挟まれた文字列と同じパラグラフ番号（もしくは見出し語）へのリンクに変換します。
例：これは[ゲームブック・エディター]へのリンクです。
#書式
##引用文
行頭に「〉」を記述すると、その行は斜体文字の「引用文」として表示します。
>これは引用文の例です

##リスト
行頭に「-」（ハイフン）を記述すると、その行を「箇条書きリスト」として表示します。
- リスト１
- リスト２
- リスト３

##コード文
行頭に「_」（アンダーバー）を記述すると、その行を「コード文」として表示します。「コード文」は丸ゴシック体で表示されるため、ゲーム的な処理の説明などを地の文と区別して記述するのに向いています。
_これはコード文の例です。

##書式のエスケープ
行頭に半角のバックスラッシュ（もしくは半角の「￥」）を記述すると、直後の「>」や「-」や「_」を地の文として行頭に記述できます。行頭にバックスラッシュを表記したい場合、二文字連ねたバックスラッシュを記述してください。
例：
\〉これらは
\- エスケープした
\_ 記号の
\\ 例です。

##強調文字
字の文や引用文、リストにおいて、文の一部を「**」（二つのアスタリスク）で挟むと、挟まれた箇所が太字で表示されます。
例：これは**強調文字**の例です。**半角のアスタリスク二個**で**強調**したい語句を挟んでください。

##改行
段落間の間隔を開けずに「改行」のみを行いたい場合、文中に半角のバックスラッシュ（もしくは半角の「￥」）を記述します。\文中に半角のバックスラッシュを表記したい場合、バックスラッシュを二文字連ねて記述してください。


#ボタンの説明
画面上部の各ボタンの説明です。
###NEW
テキストエリアの内容を全て削除します。

###OPEN TXT
編集中のテキストを破棄し、選択したテキスト・ファイル(.txt)の内容を読み込みます。

###SAVE
編集中のテキストをブラウザに一時保存します。（すでに保存されたデータがある場合は上書きされます）
ブラウザに保存したデータは長期間使用しないと消去される場合があるため、保存したいデータはテキスト・ファイルとして出力してください（後述）。

###LOAD
編集中のテキストを破棄し、ブラウザに保存されたテキスト読み込みます。

###TXT
編集中のテキストをテキスト・ファイルとして保存します。（ブラウザで「同名のファイルのダウンロードをスキップ」する設定にしている場合は保存されない場合があるのでご注意ください）

###HTML
編集中のゲームブックをHTMLファイルとして保存します。ゲームブックに画像を表示したい場合、本ページと同じ場所にある「img」フォルダを保存したHTMLファイルと同じ場所にコピーしてください。

###PDF
編集中のゲームブックを別タブで開き、印刷ダイアログを表示します。「送信先」や「プリンタ」等の設定で「PDFに保存」や「Print to PDF」などを選択すると、作成したゲームブックをリンクテキストを含んだPDFファイルとして出力できます。


#挿絵
行頭の「$」マークの直後にファイル名を記して改行すると、「img」フォルダの中にある同名のwebp画像を表示します。
（ゲームブックをHTML形式で出力した場合、HTMLファイルと同じ場所にimgフォルダを配置してください）
以下に挿絵の例を示します。
$arrow
$barrel
$books
$box
$crate
$dice
$door
$flower
$halberd
$hr
$pick
$pot
$skull
$spear
$sword
$swords

#動画
行頭の「$」マークの直後に「（ファイル名）.mp4」を記して改行すると、「img」フォルダの中にある同名のmp4動画を表示します。
例：
$sample.mp4
また、「$」マークと「（ファイル名）.mp4」の後に任意のテキスト、半角数字、平仮名の「へ」を記して改行すると、リンク先へ移動時にシネマティックに全画面表示で動画を再生するリンクテキストに変換します。（HTML形式で保存時に有効な機能です）
例：
$sample.mp4 次へ進む 0へ
